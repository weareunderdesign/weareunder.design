<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/head.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="under store">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="stylesheet" href="https://renecss.org/rene.css" />
  <style>
    under-store { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: calc(var(--base-size) * 10); }
    under-store:has(.product-detail) { display: block; }
    #cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 1001; opacity: 0; pointer-events: none; transition: opacity .2s; }
    #cart-overlay.open { opacity: 1; pointer-events: auto; }
    #cart-drawer { position: fixed; top: 0; right: 0; width: 380px; max-width: 90vw; height: 100vh; z-index: 1002; background: var(--color-primary-background); color: var(--color-primary-foreground); transform: translateX(100%); transition: transform .25s ease; overflow: auto; }
    #cart-drawer.open { transform: translateX(0); }
  </style>
  <title>store | under</title>
</head>
<body data-theme="light">
  <under-navigation></under-navigation>
  <div class="padding-xl" style="padding-top:120px">
    <under-store></under-store>
  </div>
  <script src="/js/header.js"></script>
  <script src="/js/shop.js"></script>
  <script>
    const rp = sessionStorage.getItem("redirectPath");
    if (rp) { sessionStorage.removeItem("redirectPath"); history.replaceState({}, "", rp); }
  </script>
  <script>
    document.querySelector('[data-page="store"]').addEventListener('click', function(e) {
      e.preventDefault();
      openCart();
    });
  </script>
  <script src="/js/footer.js"></script>
  <under-footer></under-footer>
</body>
</html>
