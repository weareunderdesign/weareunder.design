  <link rel="stylesheet" href="https://renecss.org/rene.css">
  <script src="marked.js"></script>
  <style>
    #underground article { max-width: 40rem; }
    #underground img,
    #underground video { width: 100%; }
  </style>
  <title>ūnder | underground</title>
  <link rel="canonical" href="https://weareunder.design/underground/">
</head>

<body data-theme="light">

  <under-navigation></under-navigation>

  <div id="underground" class="column align-center gap-xl padding-xl"></div>

  <under-footer></under-footer>

  <script>
    const slug = t => t.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');

    const renderer = new marked.Renderer();
    renderer.image = ({ href, text }) => /\.(webm|mp4)$/.test(href)
      ? `<video src="${href}" autoplay muted loop playsinline></video>`
      : `<img src="${href}" alt="${text}">`;
    renderer.heading = ({ text, depth }) => depth === 2
      ? `<h2 id="${slug(text)}">${text}</h2>`
      : `<h${depth}>${text}</h${depth}>`;

    const renderNote = note => {
      const [, title, rest] = note.match(/^##\s*(.+)\n([\s\S]*)$/);
      const [, date, body] = rest.match(/^\s*(\d{4}-\d{2}-\d{2})?([\s\S]*)$/);
      const when = date && new Date(date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toLowerCase();
      return `<article>
        <h2 id="${slug(title)}">${title}</h2>
        ${when ? `<p class="text-s text-secondary">${when}</p>` : ''}
        ${marked.parse(body, { renderer })}
      </article>`;
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const record = await (await fetch('underground.md')).text();
      underground.innerHTML = record.split(/\n-{3,}\n/).map(n => n.trim()).filter(Boolean).map(renderNote).join('');
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    });
  </script>
  <script src="/js/header.js"></script>
  <script src="/js/footer.js"></script>

</body>

</html>
